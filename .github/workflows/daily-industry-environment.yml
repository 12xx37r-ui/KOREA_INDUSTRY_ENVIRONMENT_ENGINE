name: Korea Industry Environment Engine

on:
  workflow_dispatch:
  schedule:
    # KRX 정규장 종료 후 약 1시간 25분: 16:55 KST = 07:55 UTC
    - cron: '55 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: korea-industry-environment-engine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q src tests

      - name: Unit and contract tests
        run: pytest -q

      - name: Normalize cache path
        shell: bash
        run: |
          # Git cannot track an empty directory. If a mobile/manual upload created
          # input_cache/latest as a file, normalize it before the first live run.
          if [ -e input_cache/latest ] && [ ! -d input_cache/latest ]; then
            rm -f input_cache/latest
          fi
          mkdir -p input_cache/latest
          test -d input_cache/latest

      - name: Validate and build industry cycle feed
        run: PYTHONPATH=src python -m kiee.industry_cycle_feed --root .

      - name: Run industry engine
        env:
          UPSTREAM_GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
          UPSTREAM_GITHUB_OWNER: ${{ vars.UPSTREAM_GITHUB_OWNER || '12xx37r-ui' }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: PYTHONPATH=src python -m kiee.cli --root .

      - name: Validate output contract
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/industry_environment_latest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['status']=='ok'
          assert data['industry_count'] >= 20
          assert len(data['industries']) == data['industry_count']
          for row in data['industries']:
              for block in ('current','forecast_3m','forecast_3_6m','forecast_6_12m'):
                  score=row[block].get('score')
                  status=row[block].get('status')
                  q=float(row[block].get('quality_score') or 0)
                  if score is None:
                      assert status == 'insufficient_data', (row['industry_key'], block, status)
                      assert q == 0, (row['industry_key'], block, q)
                  else:
                      s=float(score)
                      assert 0 <= s <= 100, (row['industry_key'], block, s)
                      assert 0 <= q <= 100, (row['industry_key'], block, q)
          ce=data['call_efficiency']
          assert int(ce['per_company_live_calls']) == 0
          assert int(ce['upstream_http_calls_this_run']) <= int(ce['normal_upstream_http_call_target'])
          cycle_source=data['source_status'].get('industry_cycle') or {}
          assert cycle_source.get('ok') is True, cycle_source
          print('INDUSTRY_CYCLE_SOURCE_OK=', cycle_source.get('mode'))
          # KRX 정상경로는 8회. 가격/영업일/빈응답 fallback은 장애시에만 추가되며 20회를 절대 상한으로 둔다.
          assert int(ce['krx_bulk_calls_this_run']) <= 20
          bridge=json.loads(Path('output/stock_prediction_bridge.json').read_text(encoding='utf-8'))
          assert len(bridge['by_profile_key']) == data['industry_count']
          health=json.loads(Path('output/engine_health.json').read_text(encoding='utf-8'))
          print('KRX_DIRECT_AVAILABLE=', health.get('direct_krx_available'))
          print('KRX_CREDENTIALS_CONFIGURED=', health.get('direct_krx_credentials_configured'))
          print('KRX_INDUSTRY_COVERAGE_PCT=', health.get('direct_krx_industry_coverage_pct'))
          if not health.get('direct_krx_available'):
              print('WARNING: direct KRX sector data unavailable; engine kept running with quality-gated proxy/LKG data.')
          print('OUTPUT_CONTRACT_OK')
          PY

      - name: Commit generated JSON only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output input_cache/latest || true
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore: update industry environment outputs"
            git push
          fi
