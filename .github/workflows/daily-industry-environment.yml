name: Korea Industry Environment Engine

on:
  workflow_dispatch:
    inputs:
      force_kosis:
        description: "Force one KOSIS collection even when committed raw data exists"
        required: false
        default: false
        type: boolean
      probe_kosis:
        description: "Print KOSIS table metadata needed to fix objL mappings"
        required: false
        default: false
        type: boolean
  schedule:
    # KRX 정규장 종료 후 약 1시간 25분: 16:55 KST = 07:55 UTC
    - cron: '55 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: korea-industry-environment-engine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 30 -r requirements.txt

      - name: Validate Python environment
        run: |
          python --version
          python -m pip --version
          python -m pip check
          python -c "import pytest; print('pytest', pytest.__version__)"

      - name: Syntax check
        run: python -m compileall -q src tests

      - name: Unit and contract tests
        run: python -m pytest -q

      - name: Normalize cache path
        shell: bash
        run: |
          # Git cannot track an empty directory. If a mobile/manual upload created
          # input_cache/latest as a file, normalize it before the first live run.
          if [ -e input_cache/latest ] && [ ! -d input_cache/latest ]; then
            rm -f input_cache/latest
          fi
          mkdir -p input_cache/latest
          test -d input_cache/latest
          # api_health.json is workflow-scoped telemetry, not a cross-run counter.
          rm -f output/api_health.json

      - name: Check KOSIS secret binding
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          if [ -n "${KOSIS_API_KEY:-}" ]; then
            echo "KOSIS_KEY_CONFIGURED=true"
          else
            echo "KOSIS_KEY_CONFIGURED=false"
          fi

      - name: Probe KOSIS table metadata
        if: ${{ inputs.probe_kosis == true }}
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: PYTHONPATH=src python -m kiee.kosis_table_probe

      - name: Collect customs nowcasting data
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          if [ -n "${CUSTOMS_API_KEY:-}" ]; then
            echo "CUSTOMS_KEY_CONFIGURED=true"
            PYTHONPATH=src python -m kiee.customs_nowcast_collector --root . || echo "Customs nowcast failed (non-fatal)"
          else
            echo "CUSTOMS_KEY_CONFIGURED=false — skipping nowcast"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('input/customs_nowcast_raw.json')
          if p.exists():
              d = json.loads(p.read_text(encoding='utf-8'))
              print(f"customs_nowcast: status={d.get('status')} industries={len(d.get('industries', []))} calls={d.get('external_calls', 0)}")
          else:
              print("customs_nowcast: file not found (OK if key not configured)")
          PY

      - name: Probe KOSIS table labels (manual diagnostics only)
        if: ${{ inputs.probe_kosis == true }}
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          KOSIS_REQUEST_TIMEOUT_SECONDS: '6'
          KOSIS_DATA_TIMEOUT_SECONDS: '8'
        run: |
          PYTHONPATH=src python -m kiee.kosis_label_probe --root . || echo "label probe failed (non-fatal)"

      - name: Validate and build industry cycle feed
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          KOSIS_REQUEST_TIMEOUT_SECONDS: '6'
          KOSIS_DATA_TIMEOUT_SECONDS: '8'
        run: |
          FORCE_KOSIS="${{ inputs.force_kosis || 'false' }}"
          echo "FORCE_KOSIS=$FORCE_KOSIS"
          echo "INDUSTRY_CYCLE_INPUT_MODE=kosis-cache-aware-collector"
          # Freshness-first: every workflow re-checks KOSIS at the source.
          # Exact duplicate series/table requests are removed only inside this run.
          if [ "$FORCE_KOSIS" = "true" ]; then
            PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from kiee.industry_kosis_collector import collect
          collect(Path('.').resolve(), force=True)
          PY
          else
            PYTHONPATH=src python -m kiee.industry_kosis_collector --root .
          fi
          PYTHONPATH=src python -m kiee.industry_cycle_feed --root .
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          for name in ('input/industry_cycle_raw.json', 'input/industry_cycle_latest.json'):
              path = Path(name)
              data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
              print(f'{name}: exists={path.exists()} status={data.get("status")} generated_at_utc={data.get("generated_at_utc")} industry_count={len(data.get("industries") or [])} external_calls={data.get("external_calls", "n/a")}')
              if data.get('diagnostics'):
                  print(f'{name}: diagnostics={json.dumps(data["diagnostics"], ensure_ascii=False)}')
              if data.get('reason'):
                  print(f'{name}: reason={data["reason"]}')
          upstreams = json.loads(Path('config/upstreams.json').read_text(encoding='utf-8'))
          cycle = (upstreams.get('sources') or {}).get('industry_cycle') or {}
          print('INDUSTRY_CYCLE_LOCAL_PATH=', cycle.get('local_path'))
          assert cycle.get('local_path') == 'input/industry_cycle_latest.json'
          PY

      - name: Collect DART earnings / revenue / margin gaps
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -n "${DART_API_KEY:-}" ]; then
            echo "DART_KEY_CONFIGURED=true"
            PYTHONPATH=src python -m kiee.dart_earnings_collector --root . || echo "DART direct fundamentals failed (non-fatal)"
          else
            echo "DART_KEY_CONFIGURED=false — skipping DART earnings"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('input/dart_earnings_raw.json')
          if p.exists():
              d = json.loads(p.read_text(encoding='utf-8'))
              print(f"dart_earnings: status={d.get('status')} industries={len(d.get('industries', []))} calls={d.get('external_calls', 0)}")
          else:
              print("dart_earnings: file not found (OK if key not configured)")
          PY


      - name: Run industry engine
        env:
          UPSTREAM_GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
          UPSTREAM_GITHUB_OWNER: ${{ vars.UPSTREAM_GITHUB_OWNER || '12xx37r-ui' }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: PYTHONPATH=src python -m kiee.cli --root .

      - name: Validate output contract
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/industry_environment_latest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['status']=='ok'
          assert data['industry_count'] >= 20
          assert len(data['industries']) == data['industry_count']
          for row in data['industries']:
              for block in ('current','forecast_3m','forecast_3_6m','forecast_6_12m'):
                  score=row[block].get('score')
                  status=row[block].get('status')
                  q=float(row[block].get('quality_score') or 0)
                  if score is None:
                      assert status == 'insufficient_data', (row['industry_key'], block, status)
                      assert q == 0, (row['industry_key'], block, q)
                  else:
                      s=float(score)
                      assert 0 <= s <= 100, (row['industry_key'], block, s)
                      assert 0 <= q <= 100, (row['industry_key'], block, q)
          ce=data['call_efficiency']
          assert int(ce['per_company_live_calls']) == 0
          assert int(ce['upstream_http_calls_this_run']) <= int(ce['normal_upstream_http_call_target'])
          cycle_source=data['source_status'].get('industry_cycle') or {}
          assert cycle_source.get('ok') is True, cycle_source
          print('INDUSTRY_CYCLE_SOURCE_OK=', cycle_source.get('mode'))
          # KRX 정상경로는 8회. 가격/영업일/빈응답 fallback은 장애시에만 추가되며 20회를 절대 상한으로 둔다.
          assert int(ce['krx_bulk_calls_this_run']) <= 20
          bridge=json.loads(Path('output/stock_prediction_bridge.json').read_text(encoding='utf-8'))
          assert len(bridge['by_profile_key']) == data['industry_count']
          api_health=json.loads(Path('output/api_health.json').read_text(encoding='utf-8'))
          assert api_health.get('policy', {}).get('priority') == 'freshness_first'
          print('API_HEALTH_TOTALS=', json.dumps(api_health.get('totals') or {}, ensure_ascii=False))
          health=json.loads(Path('output/engine_health.json').read_text(encoding='utf-8'))
          print('KRX_DIRECT_AVAILABLE=', health.get('direct_krx_available'))
          print('KRX_CREDENTIALS_CONFIGURED=', health.get('direct_krx_credentials_configured'))
          print('KRX_INDUSTRY_COVERAGE_PCT=', health.get('direct_krx_industry_coverage_pct'))
          if not health.get('direct_krx_available'):
              print('WARNING: direct KRX sector data unavailable; engine kept running with quality-gated proxy/LKG data.')
          print('OUTPUT_CONTRACT_OK')
          PY

      - name: Commit generated JSON only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output input input_cache/latest || true
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore: update industry environment outputs"
            git push
          fi
